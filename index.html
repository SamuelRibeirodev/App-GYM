<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meus Treinos">
  <meta name="theme-color" content="#0d0d0d">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="icon" type="image/png" href="/icon.png">
  <title>Meus Treinos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0a0a0a;
  --surface: #161616;
  --surface2: #1f1f1f;
  --border: #2a2a2a;
  --text: #f5f5f5;
  --text2: #888;
  --text3: #555;
  --accent: #ffffff;
  --accent-dark: #cccccc;
  --green: #f0f0f0;
  --green-bg: #1a1a1a;
  --red: #f87171;
  --red-bg: #2a0d0d;
  --radius: 14px;
  --radius-sm: 8px;
  --font: 'Space Grotesk', system-ui, sans-serif;
  --nav-h: 72px;
}
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; }
#app { display: flex; flex-direction: column; height: 100%; max-width: 430px; margin: 0 auto; position: relative; }
.scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--nav-h) + 8px); }
.scroll-area::-webkit-scrollbar { display: none; }
.screen { display: none; padding: 16px 16px 0; animation: fadeIn .2s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-top: 8px; }
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
.page-subtitle { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
#bottom-nav { height: var(--nav-h); background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: stretch; padding-bottom: env(safe-area-inset-bottom); }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; border: none; background: none; color: var(--text2); font-family: var(--font); font-size: 10px; font-weight: 500; transition: color .15s; }
.nav-btn.active { color: var(--accent); }
.nav-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
.nav-icon svg { width: 22px; height: 22px; stroke-width: 1.8; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.card-accent { border-left: 3px solid var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 18px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: var(--font); font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s; min-height: 44px; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #0a0a0a; border-color: var(--accent); font-weight: 700; }
.btn-primary:active { background: var(--accent-dark); }
.btn-block { width: 100%; display: flex; }
.btn-sm { padding: 8px 14px; font-size: 13px; min-height: 36px; border-radius: 6px; }
.btn-danger { background: var(--red-bg); color: var(--red); border-color: #4a1515; }
.btn-ghost { background: none; border-color: transparent; color: var(--text2); }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .3px; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
.stat-val { font-size: 22px; font-weight: 700; color: var(--accent); }
.stat-lbl { font-size: 11px; color: var(--text2); margin-top: 2px; text-transform: uppercase; letter-spacing: .5px; }
.plan-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; cursor: pointer; transition: border-color .15s; position: relative; overflow: hidden; }
.plan-card::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 3px; background: var(--accent); }
.plan-card:active { border-color: var(--accent); }
.plan-name { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.plan-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.plan-sets { font-size: 12px; color: var(--text2); }
.ex-item { background: var(--surface2); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
.ex-num { width: 32px; height: 32px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text2); flex-shrink: 0; }
.ex-info { flex: 1; }
.ex-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.ex-detail { font-size: 12px; color: var(--text2); }
.set-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.set-item:last-child { border-bottom: none; }
.set-circle { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text2); cursor: pointer; transition: all .2s; flex-shrink: 0; }
.set-circle.done { background: var(--accent); border-color: var(--accent); color: #0a0a0a; }
.set-label { flex: 1; font-size: 14px; color: var(--text2); }
.set-weight-input { width: 72px; padding: 6px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--font); font-size: 13px; text-align: center; }
.wk-timer { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); letter-spacing: -1px; }
.progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 16px; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s ease; }
.rest-overlay { position: fixed; bottom: calc(var(--nav-h) + 12px); left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 400px; background: var(--surface2); border: 1px solid var(--accent); border-radius: var(--radius); padding: 14px 16px; display: none; align-items: center; justify-content: space-between; gap: 12px; z-index: 50; box-shadow: 0 8px 32px rgba(0,0,0,.6); }
.rest-overlay.visible { display: flex; }
.rest-label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
.rest-count { font-size: 32px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.history-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 8px; }
.history-date { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.history-name { font-size: 15px; font-weight: 600; }
.history-stats { font-size: 12px; color: var(--text2); margin-top: 4px; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--surface); border-radius: var(--radius) var(--radius) 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); width: 100%; max-width: 430px; max-height: 88vh; overflow-y: auto; }
.modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font); font-size: 15px; min-height: 44px; }
.input:focus { outline: none; border-color: var(--accent); }
.input-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.muscle-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.muscle-tag { padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; min-height: 36px; display: flex; align-items: center; }
.muscle-tag.on { background: var(--accent); color: #0a0a0a; border-color: var(--accent); font-weight: 700; }
.filter-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
.filter-chips::-webkit-scrollbar { display: none; }
.chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); font-size: 13px; white-space: nowrap; cursor: pointer; transition: all .15s; }
.chip.active { background: var(--accent); color: #0a0a0a; border-color: var(--accent); font-weight: 600; }
.empty { text-align: center; padding: 48px 16px; color: var(--text2); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.finish-screen { text-align: center; padding: 32px 16px; }
.finish-title { font-size: 36px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--accent); color: var(--text); padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; z-index: 200; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
.drag-handle { cursor: grab; padding: 4px; flex-shrink: 0; display: flex; align-items: center; touch-action: none; }
.drag-handle:active { cursor: grabbing; }
.sortable-ghost { opacity: 0.4; background: var(--surface2); }
.sortable-chosen { box-shadow: 0 4px 20px rgba(0,0,0,.4); }
.prog-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.prog-row:last-child { border-bottom: none; }
.prog-row .date { color: var(--text2); }
.prog-row .val { font-weight: 700; }
.prog-delta-up { color: var(--accent); }
.prog-delta-down { color: var(--red); }
  </style>
</head>
<body>
<div id="app">
  <div class="scroll-area" id="scroll-area">

    <div class="screen active" id="screen-home">
      <div class="page-header">
        <div>
          <div class="page-subtitle" id="greeting-time">Bom dia</div>
          <div class="page-title">Meus Treinos</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn btn-sm btn-primary" onclick="openModal('modal-plan',null)">+ Novo</button>
        </div>
      </div>
      <div class="stats-grid" id="home-stats"></div>
      <div class="filter-chips" id="filter-chips"></div>
      <div id="plans-list"></div>
    </div>

    <div class="screen" id="screen-plan">
      <div class="page-header">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="btn btn-sm btn-ghost" onclick="goHome()" style="padding:8px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20" height="20"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          </button>
          <div>
            <div class="page-subtitle" id="plan-muscle-label"></div>
            <div class="page-title" style="font-size:22px" id="plan-detail-name"></div>
          </div>
        </div>
        <button class="btn btn-sm" onclick="openModal('modal-plan', currentPlanId)">Editar</button>
      </div>
      <p style="font-size:12px;color:var(--text3);margin-bottom:12px">Segure e arraste ≡ para reordenar</p>
      <div id="plan-exercises-list"></div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn btn-primary btn-block" style="flex:3" onclick="startWorkout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Iniciar Treino
        </button>
        <button class="btn" style="flex:1" onclick="openModal('modal-exercise',null)">+ Exerc.</button>
      </div>
    </div>

    <div class="screen" id="screen-workout">
      <div class="page-header" style="margin-bottom:10px">
        <div>
          <div class="page-subtitle">Treino em andamento</div>
          <div style="font-size:18px;font-weight:700" id="wk-plan-name"></div>
        </div>
        <div class="wk-timer" id="wk-timer">00:00</div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="wk-progress" style="width:0%"></div></div>
      <div class="stats-grid" id="wk-stats" style="margin-bottom:16px"></div>
      <div id="wk-exercises"></div>
      <div id="wk-finish" style="display:none" class="finish-screen">
        <div class="finish-title">Treino feito! 💪</div>
        <p style="color:var(--text2);margin-bottom:24px">Tempo: <span id="finish-time"></span></p>
        <button class="btn btn-primary btn-block" onclick="finishWorkout()">Salvar e Finalizar</button>
      </div>
      <button class="btn btn-danger" style="margin-top:8px;width:100%" onclick="confirmEnd()">Encerrar sem salvar</button>
    </div>

    <div class="screen" id="screen-progress">
      <div class="page-header">
        <div>
          <div class="page-subtitle">Carga ao longo do tempo</div>
          <div class="page-title">Progresso</div>
        </div>
      </div>
      <div class="field">
        <label>Escolha um exercício</label>
        <select class="input" id="progress-select" onchange="onProgressExerciseChange()">
          <option value="">Selecione...</option>
        </select>
      </div>
      <div id="progress-content">
        <div class="empty">
          <div class="empty-icon">📈</div>
          <p>Selecione um exercício para ver sua evolução de carga.</p>
        </div>
      </div>
    </div>

    <div class="screen" id="screen-history">
      <div class="page-header"><div class="page-title">Histórico</div></div>
      <div id="history-list"></div>
    </div>

  </div>

  <div class="rest-overlay" id="rest-overlay">
    <div>
      <div class="rest-label">Descanso</div>
      <div class="rest-count" id="rest-count">60</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" onclick="addRest(15)">+15s</button>
        <button class="btn btn-sm btn-primary" onclick="skipRest()">Pular</button>
      </div>
      <div style="width:120px;height:3px;background:var(--border);border-radius:2px">
        <div id="rest-progress" style="height:100%;background:var(--accent);border-radius:2px;width:100%"></div>
      </div>
    </div>
  </div>

  <nav id="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="goHome()">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      Treinos
    </button>
    <button class="nav-btn" id="nav-workout" onclick="goWorkout()" style="position:relative">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg></div>
      Ativo
      <div id="nav-dot" style="display:none;position:absolute;top:8px;right:22px;width:8px;height:8px;background:var(--accent);border-radius:50%"></div>
    </button>
    <button class="nav-btn" id="nav-progress" onclick="goProgress()">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg></div>
      Progresso
    </button>
    <button class="nav-btn" id="nav-history" onclick="goHistory()">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
      Histórico
    </button>
  </nav>

  <div class="modal-backdrop" id="modal-plan" style="display:none" onclick="closeModalOutside(event,'modal-plan')">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title" id="modal-plan-title">Novo Treino</div>
      <div class="field"><label>Nome do treino</label><input class="input" id="inp-plan-name" placeholder="Ex: Treino A – Peito"></div>
      <div class="field"><label>Grupos musculares</label><div class="muscle-tags" id="muscle-tags"></div></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-primary" id="save-plan-btn" style="flex:1" onclick="handleSavePlan()">Salvar</button>
        <button class="btn" onclick="closeModal('modal-plan')">Cancelar</button>
      </div>
      <div id="delete-plan-wrap" style="margin-top:10px;display:none">
        <button class="btn btn-danger btn-block" onclick="handleDeletePlan()">Excluir treino</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-exercise" style="display:none" onclick="closeModalOutside(event,'modal-exercise')">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Adicionar Exercício</div>
      <div class="field"><label>Nome</label><input class="input" id="inp-ex-name" placeholder="Ex: Supino Reto"></div>
      <div class="input-row">
        <div class="field"><label>Sets</label><input class="input" id="inp-ex-sets" type="number" value="4" min="1" max="20"></div>
        <div class="field"><label>Reps</label><input class="input" id="inp-ex-reps" placeholder="10"></div>
        <div class="field"><label>Carga (kg)</label><input class="input" id="inp-ex-weight" placeholder="–"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn btn-primary" id="save-ex-btn" style="flex:1" onclick="handleSaveExercise()">Adicionar</button>
        <button class="btn" onclick="closeModal('modal-exercise')">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script>
// ===== Armazenamento local (localStorage) =====
const STORE_KEY = 'meus-treinos:v1';
let db = { plans: [], sessions: [], setLogs: [] };
let plans = [];
let lastWeights = {};

function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function loadDb() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      db = {
        plans: Array.isArray(parsed.plans) ? parsed.plans : [],
        sessions: Array.isArray(parsed.sessions) ? parsed.sessions : [],
        setLogs: Array.isArray(parsed.setLogs) ? parsed.setLogs : [],
      };
    }
  } catch (e) { console.error('Erro ao ler dados locais:', e); }
}

function saveDb() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch (e) { console.error(e); toast('Sem espaço ou armazenamento bloqueado'); throw e; }
}

function rebuildPlans() {
  plans = db.plans
    .slice().sort((a, b) => a.order_index - b.order_index)
    .map(p => ({ ...p, exercises: p.exercises.slice().sort((a, b) => a.order_index - b.order_index) }));
}

function rebuildLastWeights() {
  lastWeights = {};
  db.setLogs.filter(l => l.weight !== '' && l.weight != null)
    .sort((a, b) => (b.completed_at || '').localeCompare(a.completed_at || ''))
    .forEach(l => { if (!lastWeights[l.exercise_name]) lastWeights[l.exercise_name] = l.weight; });
}

async function loadData() { loadDb(); rebuildPlans(); rebuildLastWeights(); }

async function createPlan(name, muscles) {
  const plan = { id: uid(), name, muscles, order_index: db.plans.length, exercises: [] };
  db.plans.push(plan);
  saveDb(); rebuildPlans();
  return plan;
}

async function updatePlan(planId, name, muscles) {
  const p = db.plans.find(x => x.id === planId);
  if (!p) return;
  p.name = name; p.muscles = muscles;
  saveDb(); rebuildPlans();
}

async function removePlan(planId) {
  db.plans = db.plans.filter(p => p.id !== planId);
  saveDb(); rebuildPlans();
}

async function createExercise(planId, { name, sets, reps, weight, notes }) {
  const p = db.plans.find(x => x.id === planId);
  if (!p) throw new Error('Treino não encontrado');
  const ex = { id: uid(), name, sets, reps, weight: weight || '', notes: notes || '', order_index: p.exercises.length };
  p.exercises.push(ex);
  saveDb(); rebuildPlans();
  return ex;
}

async function removeExercise(planId, exerciseId) {
  const p = db.plans.find(x => x.id === planId);
  if (!p) return;
  p.exercises = p.exercises.filter(e => e.id !== exerciseId);
  p.exercises.forEach((e, i) => { e.order_index = i; });
  saveDb(); rebuildPlans();
}

async function reorderExercises(planId, newOrder) {
  const p = db.plans.find(x => x.id === planId);
  if (!p) return;
  newOrder.forEach((id, index) => { const e = p.exercises.find(x => x.id === id); if (e) e.order_index = index; });
  saveDb(); rebuildPlans();
}

async function saveWorkoutSession(wk) {
  const now = new Date().toISOString();
  const session = {
    id: uid(), plan_id: wk.planId, plan_name: wk.planName,
    duration_seconds: wk.elapsed,
    total_sets: wk.exercises.reduce((a, e) => a + e.setsState.filter(Boolean).length, 0),
    started_at: new Date(wk.startTimestamp).toISOString(), finished_at: now,
  };
  db.sessions.push(session);
  wk.exercises.forEach(ex => {
    ex.setsState.forEach((done, i) => {
      if (done) db.setLogs.push({
        id: uid(), session_id: session.id, exercise_name: ex.name,
        set_number: i + 1, weight: ex.weights[i] || '', reps: ex.reps, completed_at: now,
      });
    });
  });
  saveDb(); rebuildLastWeights();
  return session;
}

async function loadHistory() {
  return db.sessions.slice().sort((a, b) => (b.finished_at || '').localeCompare(a.finished_at || '')).slice(0, 50);
}

async function loadExerciseListForProgress() {
  return [...new Set(db.setLogs.filter(l => l.weight !== '' && l.weight != null).map(l => l.exercise_name))].sort();
}

async function loadExerciseProgress(name) {
  return db.setLogs.filter(l => l.exercise_name === name)
    .sort((a, b) => (a.completed_at || '').localeCompare(b.completed_at || ''));
}

async function init() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  try { await loadData(); } catch (e) { console.error('loadData error:', e); }
  document.getElementById('app').style.display = 'flex';
  renderHome();
  showScreen('home');
}
</script>

<script>
let wk = null;
let wkInterval = null;
let restInterval = null;
let restTotal = 60;
let restEndTimestamp = null;

function startWorkout() {
  const plan = plans.find(p => p.id === currentPlanId);
  wk = {
    planId: plan.id, planName: plan.name, startTimestamp: Date.now(), elapsed: 0,
    exercises: plan.exercises.map(ex => ({
      ...ex, setsState: Array(ex.sets).fill(false),
      weights: Array(ex.sets).fill(lastWeights[ex.name] || ex.weight || ''),
    })),
  };
  document.getElementById('wk-plan-name').textContent = plan.name;
  document.getElementById('nav-dot').style.display = 'block';
  showScreen('workout');
  renderWorkout();
  startWorkoutTimer();
  document.addEventListener('visibilitychange', onVisibilityChange);
}

function startWorkoutTimer() {
  clearInterval(wkInterval);
  wkInterval = setInterval(() => {
    if (!wk) return;
    wk.elapsed = Math.floor((Date.now() - wk.startTimestamp) / 1000);
    document.getElementById('wk-timer').textContent = fmtTime(wk.elapsed);
  }, 500);
}

function onVisibilityChange() {
  if (!document.hidden && wk) {
    wk.elapsed = Math.floor((Date.now() - wk.startTimestamp) / 1000);
    document.getElementById('wk-timer').textContent = fmtTime(wk.elapsed);
    startWorkoutTimer();
    syncRestTimer();
  }
}

function renderWorkout() {
  const totalSets = wk.exercises.reduce((a, e) => a + e.sets, 0);
  const doneSets = wk.exercises.reduce((a, e) => a + e.setsState.filter(Boolean).length, 0);
  const pct = totalSets ? Math.round(doneSets / totalSets * 100) : 0;
  document.getElementById('wk-progress').style.width = pct + '%';
  document.getElementById('wk-stats').innerHTML = `
    <div class="stat"><div class="stat-val">${doneSets}</div><div class="stat-lbl">Feitos</div></div>
    <div class="stat"><div class="stat-val">${totalSets - doneSets}</div><div class="stat-lbl">Restam</div></div>
    <div class="stat"><div class="stat-val">${pct}%</div><div class="stat-lbl">Progresso</div></div>`;
  document.getElementById('wk-exercises').innerHTML = wk.exercises.map((ex, ei) => {
    const allDone = ex.setsState.every(Boolean);
    return `
      <div class="card ${allDone ? '' : 'card-accent'}" style="${allDone ? 'opacity:.5' : ''}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="font-size:15px;font-weight:700">${esc(ex.name)}</div>
          ${allDone ? `<span class="badge" style="background:var(--green-bg);color:var(--green)">Concluído</span>` : `<span style="font-size:12px;color:var(--text2)">${ex.reps} reps</span>`}
        </div>
        ${ex.setsState.map((done, si) => `
          <div class="set-item">
            <div class="set-circle ${done ? 'done' : ''}" onclick="toggleSet(${ei}, ${si})">
              ${done ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="16" height="16" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>` : si + 1}
            </div>
            <span class="set-label">Set ${si + 1}</span>
            <input class="set-weight-input" type="number" placeholder="kg" value="${esc(ex.weights[si])}" onchange="updateWeight(${ei}, ${si}, this.value)" ${done ? 'style="opacity:.4"' : ''}>
          </div>`).join('')}
      </div>`;
  }).join('');
  const allDone = wk.exercises.every(e => e.setsState.every(Boolean));
  document.getElementById('wk-finish').style.display = allDone ? 'block' : 'none';
  if (allDone) {
    document.getElementById('finish-time').textContent = fmtTime(wk.elapsed);
    clearInterval(wkInterval);
  }
}

function toggleSet(ei, si) {
  const newVal = !wk.exercises[ei].setsState[si];
  wk.exercises[ei].setsState[si] = newVal;
  if (newVal) startRest(60);
  if ('vibrate' in navigator) navigator.vibrate(40);
  renderWorkout();
}

function updateWeight(ei, si, val) { wk.exercises[ei].weights[si] = val; }

function startRest(seconds) {
  clearInterval(restInterval);
  restTotal = seconds;
  restEndTimestamp = Date.now() + seconds * 1000;
  document.getElementById('rest-overlay').classList.add('visible');
  function tick() {
    const left = Math.max(0, Math.ceil((restEndTimestamp - Date.now()) / 1000));
    document.getElementById('rest-count').textContent = left;
    const pct = (left / restTotal) * 100;
    document.getElementById('rest-progress').style.cssText = `height:100%;background:var(--accent);border-radius:2px;width:${pct}%`;
    if (left <= 0) {
      clearInterval(restInterval);
      restEndTimestamp = null;
      document.getElementById('rest-overlay').classList.remove('visible');
      playBeep();
    }
  }
  tick();
  restInterval = setInterval(tick, 500);
}

function syncRestTimer() {
  if (!restEndTimestamp) return;
  const left = Math.max(0, Math.ceil((restEndTimestamp - Date.now()) / 1000));
  if (left <= 0) { skipRest(); playBeep(); }
}

function addRest(s) { if (restEndTimestamp) { restEndTimestamp += s * 1000; restTotal += s; } }

function skipRest() {
  clearInterval(restInterval);
  restEndTimestamp = null;
  document.getElementById('rest-overlay').classList.remove('visible');
}

async function finishWorkout() {
  try { await saveWorkoutSession(wk); toast('Treino salvo! 💪'); }
  catch (e) { console.error(e); toast('Erro ao salvar treino'); }
  endWorkout();
}

function endWorkout() {
  clearInterval(wkInterval);
  clearInterval(restInterval);
  document.removeEventListener('visibilitychange', onVisibilityChange);
  wk = null;
  restEndTimestamp = null;
  document.getElementById('rest-overlay').classList.remove('visible');
  document.getElementById('nav-dot').style.display = 'none';
  goHome();
}

function confirmEnd() { if (confirm('Encerrar treino sem salvar?')) endWorkout(); }

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880; gain.gain.value = 0.3;
    osc.start(); osc.stop(ctx.currentTime + 0.15);
  } catch (e) {}
}

function fmtTime(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
</script>

<script>
const MUSCLES = ['Peito','Costas','Ombro','Bíceps','Tríceps','Pernas','Glúteos','Abdômen','Panturrilha'];

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  document.getElementById('scroll-area').scrollTop = 0;
  document.getElementById('nav-home').classList.toggle('active', id === 'home' || id === 'plan');
  document.getElementById('nav-workout').classList.toggle('active', id === 'workout');
  document.getElementById('nav-progress').classList.toggle('active', id === 'progress');
  document.getElementById('nav-history').classList.toggle('active', id === 'history');
}

function goHome() { showScreen('home'); renderHome(); }
function goWorkout() { wk ? showScreen('workout') : goHome(); }
function goHistory() { showScreen('history'); renderHistoryScreen(); }
function goProgress() { showScreen('progress'); renderProgressScreen(); }

function setGreeting() {
  const h = new Date().getHours();
  const el = document.getElementById('greeting-time');
  if (el) el.textContent = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
}

function renderHome() {
  setGreeting();
  const totalEx = plans.reduce((a, p) => a + p.exercises.length, 0);
  document.getElementById('home-stats').innerHTML = `
    <div class="stat"><div class="stat-val">${plans.length}</div><div class="stat-lbl">Treinos</div></div>
    <div class="stat"><div class="stat-val">${totalEx}</div><div class="stat-lbl">Exercícios</div></div>
    <div class="stat"><div class="stat-val">${Object.keys(lastWeights).length}</div><div class="stat-lbl">Cargas</div></div>`;
  const allMuscles = [...new Set(plans.flatMap(p => p.muscles))];
  document.getElementById('filter-chips').innerHTML =
    `<div class="chip ${!filterMuscle ? 'active' : ''}" onclick="setFilter(null)">Todos</div>` +
    allMuscles.map(m => `<div class="chip ${filterMuscle === m ? 'active' : ''}" onclick="setFilter('${m}')">${m}</div>`).join('');
  const filtered = filterMuscle ? plans.filter(p => p.muscles.includes(filterMuscle)) : plans;
  document.getElementById('plans-list').innerHTML = filtered.length
    ? filtered.map(p => `
        <div class="plan-card" onclick="openPlan('${p.id}')">
          <div class="plan-name">${esc(p.name)}</div>
          <div>${p.muscles.map(m => muscleBadge(m)).join('')}</div>
          <div class="plan-meta">
            <span class="plan-sets">${p.exercises.length} exercícios · ${p.exercises.reduce((a, e) => a + e.sets, 0)} sets</span>
            <span style="font-size:12px;color:var(--accent);font-weight:600">Iniciar →</span>
          </div>
        </div>`).join('')
    : `<div class="empty"><div class="empty-icon">🏋️</div><p>Nenhum treino ainda.<br>Crie o primeiro!</p></div>`;
  document.getElementById('nav-dot').style.display = wk ? 'block' : 'none';
}

function muscleBadge(m) {
  return `<span class="badge" style="background:#2a2a2a;color:#f0f0f0;margin:2px;border:1px solid #3a3a3a">${m}</span>`;
}

function setFilter(m) { filterMuscle = m; renderHome(); }

function openPlan(id) {
  currentPlanId = id;
  const plan = plans.find(p => p.id === id);
  document.getElementById('plan-detail-name').textContent = plan.name;
  document.getElementById('plan-muscle-label').textContent = plan.muscles.join(' · ');
  renderPlanExercises();
  showScreen('plan');
}

function renderPlanExercises() {
  const plan = plans.find(p => p.id === currentPlanId);
  const el = document.getElementById('plan-exercises-list');
  if (!plan.exercises.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">➕</div><p>Nenhum exercício ainda.<br>Adicione abaixo!</p></div>`;
    return;
  }
  el.innerHTML = plan.exercises.map((ex, i) => {
    const lastW = lastWeights[ex.name];
    return `
      <div class="ex-item" data-id="${ex.id}">
        <div class="drag-handle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18" style="color:var(--text3)">
            <line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="18" x2="16" y2="18"/>
          </svg>
        </div>
        <div class="ex-num">${i + 1}</div>
        <div class="ex-info">
          <div class="ex-name">${esc(ex.name)}</div>
          <div class="ex-detail">
            ${ex.sets} sets · ${ex.reps} reps
            ${ex.weight ? ` · ${ex.weight}kg` : ''}
            ${lastW ? `<span style="color:var(--accent);margin-left:4px">→ última: ${lastW}kg</span>` : ''}
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="handleRemoveEx('${ex.id}')" style="color:var(--red);padding:6px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="16" height="16">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>
          </svg>
        </button>
      </div>`;
  }).join('');
  initSortable();
}

let sortableInstance = null;
function initSortable() {
  const el = document.getElementById('plan-exercises-list');
  if (!el || typeof Sortable === 'undefined') return;
  if (sortableInstance) sortableInstance.destroy();
  sortableInstance = Sortable.create(el, {
    handle: '.drag-handle', animation: 150,
    onEnd: async (evt) => {
      if (evt.oldIndex === evt.newIndex) return;
      const newOrder = Array.from(el.querySelectorAll('.ex-item')).map(el => el.dataset.id);
      try { await reorderExercises(currentPlanId, newOrder); renderPlanExercises(); }
      catch (e) { toast('Erro ao salvar ordem'); renderPlanExercises(); }
    },
  });
}

async function renderHistoryScreen() {
  document.getElementById('history-list').innerHTML = `<div class="empty"><div class="empty-icon">⏳</div><p>Carregando...</p></div>`;
  const data = await loadHistory();
  document.getElementById('history-list').innerHTML = data.length
    ? data.map(h => {
        const date = h.finished_at ? new Date(h.finished_at).toLocaleDateString('pt-BR', { weekday:'short', day:'numeric', month:'short' }) : '–';
        return `
          <div class="history-item">
            <div class="history-date">${date}</div>
            <div class="history-name">${esc(h.plan_name)}</div>
            <div class="history-stats">${h.total_sets} sets · ${fmtTime(h.duration_seconds || 0)}</div>
          </div>`;
      }).join('')
    : `<div class="empty"><div class="empty-icon">📅</div><p>Nenhum treino realizado ainda.<br>Comece agora!</p></div>`;
}

// Progress screen
let progressChart = null;

async function renderProgressScreen() {
  const list = await loadExerciseListForProgress();
  const select = document.getElementById('progress-select');
  select.innerHTML = '<option value="">Selecione...</option>' + list.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  if (list.length === 0) {
    document.getElementById('progress-content').innerHTML = `<div class="empty"><div class="empty-icon">📈</div><p>Você ainda não tem cargas registradas.<br>Faça um treino com pesos para começar.</p></div>`;
  } else {
    document.getElementById('progress-content').innerHTML = `<div class="empty"><div class="empty-icon">📈</div><p>Selecione um exercício acima para ver sua evolução.</p></div>`;
  }
}

async function onProgressExerciseChange() {
  const name = document.getElementById('progress-select').value;
  const content = document.getElementById('progress-content');
  if (!name) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">📈</div><p>Selecione um exercício acima para ver sua evolução.</p></div>`;
    if (progressChart) { progressChart.destroy(); progressChart = null; }
    return;
  }
  content.innerHTML = `<div class="empty"><div class="empty-icon">⏳</div><p>Carregando...</p></div>`;
  const logs = await loadExerciseProgress(name);
  // Aggregate by date — take the MAX weight per day
  const byDate = {};
  logs.forEach(log => {
    const date = (log.completed_at || '').split('T')[0];
    if (!date) return;
    const w = parseFloat(String(log.weight).replace(',', '.')) || 0;
    if (w <= 0) return;
    if (!byDate[date] || w > byDate[date]) byDate[date] = w;
  });
  const points = Object.entries(byDate).sort((a,b) => a[0].localeCompare(b[0])).map(([date, weight]) => ({ date, weight }));
  if (points.length === 0) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">📊</div><p>Sem dados de carga registrados para este exercício ainda.</p></div>`;
    return;
  }
  const lastW = points[points.length - 1].weight;
  const firstW = points[0].weight;
  const maxW = Math.max(...points.map(p => p.weight));
  const delta = lastW - firstW;
  const deltaPct = firstW > 0 ? Math.round((delta / firstW) * 100) : 0;
  const deltaStr = `${delta >= 0 ? '+' : ''}${delta.toFixed(1).replace(/\.0$/, '')}kg`;
  const deltaCls = delta >= 0 ? 'prog-delta-up' : 'prog-delta-down';
  content.innerHTML = `
    <div class="stats-grid">
      <div class="stat"><div class="stat-val">${lastW}kg</div><div class="stat-lbl">Atual</div></div>
      <div class="stat"><div class="stat-val">${maxW}kg</div><div class="stat-lbl">Recorde</div></div>
      <div class="stat"><div class="stat-val ${deltaCls}">${deltaStr}</div><div class="stat-lbl">${delta >= 0 ? '+' : ''}${deltaPct}%</div></div>
    </div>
    <div class="card" style="padding:14px">
      <div style="height:240px;position:relative"><canvas id="progress-chart"></canvas></div>
    </div>
    <div class="card">
      <div style="font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Últimas ${Math.min(points.length, 10)} sessões</div>
      ${points.slice(-10).reverse().map(p => `
        <div class="prog-row">
          <span class="date">${new Date(p.date).toLocaleDateString('pt-BR', {day:'2-digit', month:'short', year:'2-digit'})}</span>
          <span class="val">${p.weight}kg</span>
        </div>`).join('')}
    </div>`;
  // Render chart
  if (progressChart) progressChart.destroy();
  const ctx = document.getElementById('progress-chart').getContext('2d');
  const labels = points.map(p => new Date(p.date).toLocaleDateString('pt-BR', {day:'numeric', month:'short'}));
  const values = points.map(p => p.weight);
  progressChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: '#ffffff',
        backgroundColor: 'rgba(255,255,255,0.08)',
        borderWidth: 2,
        fill: true,
        tension: 0.3,
        pointBackgroundColor: '#ffffff',
        pointBorderColor: '#0a0a0a',
        pointBorderWidth: 2,
        pointRadius: 4,
        pointHoverRadius: 6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => `${c.parsed.y}kg` } }
      },
      scales: {
        x: { grid: { color: '#2a2a2a' }, ticks: { color: '#888', maxRotation: 0, autoSkip: true, maxTicksLimit: 7 } },
        y: { grid: { color: '#2a2a2a' }, ticks: { color: '#888', callback: v => v + 'kg' }, beginAtZero: false }
      }
    }
  });
}

let selectedMuscles = [];
let editingPlanId = null;

function openModal(id, planId) {
  if (id === 'modal-plan') {
    editingPlanId = planId || null;
    document.getElementById('modal-plan-title').textContent = planId ? 'Editar Treino' : 'Novo Treino';
    document.getElementById('delete-plan-wrap').style.display = planId ? 'block' : 'none';
    if (planId) {
      const p = plans.find(x => x.id === planId);
      document.getElementById('inp-plan-name').value = p.name;
      selectedMuscles = [...p.muscles];
    } else {
      document.getElementById('inp-plan-name').value = '';
      selectedMuscles = [];
    }
    renderMuscleTags();
  }
  if (id === 'modal-exercise') {
    document.getElementById('inp-ex-name').value = '';
    document.getElementById('inp-ex-sets').value = '4';
    document.getElementById('inp-ex-reps').value = '';
    document.getElementById('inp-ex-weight').value = '';
  }
  document.getElementById(id).style.display = 'flex';
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function closeModalOutside(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }

function renderMuscleTags() {
  document.getElementById('muscle-tags').innerHTML = MUSCLES.map(m =>
    `<div class="muscle-tag ${selectedMuscles.includes(m) ? 'on' : ''}" onclick="toggleMuscle('${m}')">${m}</div>`).join('');
}

function toggleMuscle(m) {
  selectedMuscles = selectedMuscles.includes(m) ? selectedMuscles.filter(x => x !== m) : [...selectedMuscles, m];
  renderMuscleTags();
}

async function handleSavePlan() {
  const name = document.getElementById('inp-plan-name').value.trim();
  if (!name) { toast('Digite um nome'); return; }
  const btn = document.getElementById('save-plan-btn');
  btn.disabled = true;
  try {
    if (editingPlanId) {
      await updatePlan(editingPlanId, name, selectedMuscles);
      closeModal('modal-plan');
      openPlan(editingPlanId);
    } else {
      await createPlan(name, selectedMuscles);
      closeModal('modal-plan');
      renderHome();
    }
  } catch (e) { toast('Erro ao salvar treino'); }
  btn.disabled = false;
}

async function handleDeletePlan() {
  if (!confirm('Excluir este treino?')) return;
  try {
    await removePlan(editingPlanId);
    closeModal('modal-plan');
    goHome();
    toast('Treino excluído');
  } catch (e) { toast('Erro ao excluir'); }
}

async function handleSaveExercise() {
  const name = document.getElementById('inp-ex-name').value.trim();
  if (!name) { toast('Digite o nome do exercício'); return; }
  const btn = document.getElementById('save-ex-btn');
  btn.disabled = true;
  try {
    await createExercise(currentPlanId, {
      name,
      sets: parseInt(document.getElementById('inp-ex-sets').value) || 4,
      reps: document.getElementById('inp-ex-reps').value || '10',
      weight: document.getElementById('inp-ex-weight').value || '',
    });
    closeModal('modal-exercise');
    renderPlanExercises();
    toast('Exercício adicionado!');
  } catch (e) { toast('Erro ao adicionar exercício'); }
  btn.disabled = false;
}

async function handleRemoveEx(exerciseId) {
  if (!confirm('Remover este exercício?')) return;
  try {
    await removeExercise(currentPlanId, exerciseId);
    renderPlanExercises();
    toast('Removido');
  } catch (e) { toast('Erro ao remover'); }
}

function toast(msg) {
  let t = document.getElementById('__toast');
  if (!t) { t = document.createElement('div'); t.id = '__toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._to);
  t._to = setTimeout(() => { t.style.opacity = '0'; }, 2200);
}

let currentPlanId = null;
let filterMuscle = null;

document.addEventListener('DOMContentLoaded', init);
</script>
